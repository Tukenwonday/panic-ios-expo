name: iOS unsigned IPA (SideStore)

# Free Windows-only path: builds an UNSIGNED .ipa on a cloud Mac.
# SideStore resigns it on-device with your free Apple ID (7-day, 3-app limit).
# Push THIS FOLDER (panic-ios) as the repo root, then Run workflow -> download artifact.

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build-unsigned-ipa:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select latest Xcode
        run: |
          set -e
          ls -d /Applications/Xcode*.app || true
          LATEST=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort | tail -n1)
          if [ -n "$LATEST" ]; then
            echo "Using $LATEST"
            sudo xcode-select -s "$LATEST/Contents/Developer" || true
          fi
          xcodebuild -version || true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install deps
        run: npm ci

      - name: Prebuild iOS (generates ios/ from app.json)
        run: npx expo prebuild -p ios --non-interactive

      - name: CocoaPods install
        run: |
          cd ios
          pod install --repo-update

      - name: Build app (unsigned, no archive)
        run: |
          set -e
          WS=$(ls -d ios/*.xcworkspace | head -n1)
          echo "Workspace: $WS"
          # App project = the .xcodeproj that is NOT Pods (Pods must never be the scheme)
          APP_PROJ=$(ls -d ios/*.xcodeproj | grep -v -i pods | head -n1)
          echo "App project: $APP_PROJ"
          test -n "$APP_PROJ"
          echo "--- shared schemes in app project ---"
          ls "$APP_PROJ/xcshareddata/xcschemes/" || true
          # Deterministic scheme: the app project's own shared scheme file.
          # (xcodebuild -list order is NOT reliable: Pods schemes can come first,
          #  and building one exits 0 without producing any .app.)
          SCHEME=$(ls "$APP_PROJ/xcshareddata/xcschemes/" 2>/dev/null | head -n1 | sed 's/\.xcscheme$//')
          if [ -z "$SCHEME" ]; then
            echo "No shared scheme file, falling back to workspace list (excluding Pods)"
            SCHEME=$(xcodebuild -workspace "$WS" -list -json | python3 -c "import json,sys; d=json.load(sys.stdin); s=(d.get('workspace',{}).get('schemes') or d.get('project',{}).get('schemes') or []); s=[x for x in s if 'pod' not in x.lower()]; print(s[0] if s else '')")
          fi
          if [ -z "$SCHEME" ]; then
            echo "ERROR: could not determine app scheme"
            xcodebuild -workspace "$WS" -list || true
            exit 1
          fi
          if echo "$SCHEME" | grep -qi pods; then
            echo "ERROR: refusing to build Pods scheme ($SCHEME)"
            exit 1
          fi
          echo "Scheme: $SCHEME"
          echo "$SCHEME" > "$GITHUB_WORKSPACE/scheme.txt"
          rm -rf "$GITHUB_WORKSPACE/build/DerivedData"
          xcodebuild \
            -workspace "$WS" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath "$GITHUB_WORKSPACE/build/DerivedData" \
            build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            CODE_SIGN_IDENTITY=""

      - name: Package unsigned IPA
        run: |
          set -e
          WS=$(ls -d ios/*.xcworkspace | head -n1)
          SCHEME=$(cat "$GITHUB_WORKSPACE/scheme.txt")
          echo "Workspace: $WS"
          echo "Scheme: $SCHEME"
          # Ask Xcode itself where the product is instead of guessing paths.
          SETTINGS=$(xcodebuild \
            -workspace "$WS" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath "$GITHUB_WORKSPACE/build/DerivedData" \
            -showBuildSettings)
          BUILT_DIR=$(echo "$SETTINGS" | grep -m1 " BUILT_PRODUCTS_DIR =" | sed 's/^.*= //')
          FULL_PRODUCT=$(echo "$SETTINGS" | grep -m1 " FULL_PRODUCT_NAME =" | sed 's/^.*= //')
          WRAPPER_NAME=$(echo "$SETTINGS" | grep -m1 " WRAPPER_NAME =" | sed 's/^.*= //')
          echo "BUILT_PRODUCTS_DIR=$BUILT_DIR"
          echo "FULL_PRODUCT_NAME=$FULL_PRODUCT"
          echo "WRAPPER_NAME=$WRAPPER_NAME"
          echo "--- products dir ---"
          ls -la "$BUILT_DIR" || true
          APP_PATH="$BUILT_DIR/$FULL_PRODUCT"
          if [ ! -d "$APP_PATH" ] && [ -n "$WRAPPER_NAME" ]; then
            APP_PATH="$BUILT_DIR/$WRAPPER_NAME"
          fi
          if [ ! -d "$APP_PATH" ]; then
            echo "Not at expected path, repo-wide search:"
            find "$GITHUB_WORKSPACE/build" -name "*.app" | head -n 10 || true
            APP_PATH=$(find "$GITHUB_WORKSPACE/build" -name "*.app" | head -n1 || true)
          fi
          echo "App: $APP_PATH"
          test -n "$APP_PATH"
          test -d "$APP_PATH"
          rm -rf Payload Panic-unsigned.ipa
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -r Panic-unsigned.ipa Payload
          ls -lh Panic-unsigned.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Panic-unsigned-ipa
          path: Panic-unsigned.ipa
          if-no-files-found: error
